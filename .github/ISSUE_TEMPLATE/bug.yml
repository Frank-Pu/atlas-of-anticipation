name: 🐛 Bug report
description: Something on the atlas is broken or rendering wrong.
title: "Bug: <short description>"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: When I clicked on Tokyo, the panel was empty.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page
        2. Click "Tokyo" in the index
        3. Notice empty panel
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Browser / OS
      placeholder: Chrome 124 on macOS 14
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors (if any)
      render: text

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (drag-and-drop)

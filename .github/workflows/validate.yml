name: Validate city data

on:
  pull_request:
    paths:
      - 'cities.js'
      - 'cities-i18n.js'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'cities.js'
      - 'cities-i18n.js'

jobs:
  validate:
    name: Validate cities.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validator
        run: node scripts/validate-cities.mjs

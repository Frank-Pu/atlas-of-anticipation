<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Atlas of Anticipation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #efe8da;
  --bg-2: #e7dfcd;
  --paper: #f7f1e3;
  --ink: #1f1a12;
  --ink-soft: #4a4134;
  --sepia: #8a6f3c;
  --accent: #a87247;
  --rule: #d4c6a9;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255,246,220,0.6), rgba(255,246,220,0) 55%),
    radial-gradient(ellipse at 90% 100%, rgba(138,111,60,0.15), rgba(138,111,60,0) 50%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  color: var(--ink);
  font-family: 'Work Sans', sans-serif;
  overflow: hidden;
  min-height: 100vh;
}

/* Subtle paper grain */
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.25  0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode: multiply;
  opacity: 0.55;
  z-index: 1;
}

.app {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  padding: 28px 44px 22px;
}

/* ————— Masthead ————— */
.masthead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 18px;
}
.brand-mark {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 28px;
  color: var(--ink);
  letter-spacing: 0.02em;
}
.brand-mark .amp {
  color: var(--accent);
  margin: 0 6px;
}
.brand-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.masthead-right {
  display: flex;
  gap: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.masthead-right span { opacity: 0.85; }

/* Language switcher */
.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(6px);
}
.lang-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 5px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border-radius: 999px;
  transition: background .2s, color .2s;
  line-height: 1;
}
.lang-btn:hover { color: var(--ink); }
.lang-btn.is-active {
  background: var(--ink);
  color: var(--paper);
}
.lang-btn.cjk {
  font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: none;
  padding: 3px 10px;
}

/* CJK body classes — switch HTML to a CJK serif for cleaner reading */
html.lang-zh-Hans body, html.lang-zh-Hans .invite p, html.lang-zh-Hans .colophon em {
  font-family: 'Noto Serif SC', serif;
}
html.lang-zh-Hant body, html.lang-zh-Hant .invite p, html.lang-zh-Hant .colophon em {
  font-family: 'Noto Serif TC', serif;
}
html.lang-zh-Hans .invite h1, html.lang-zh-Hans .idx-name {
  font-family: 'Noto Serif SC', serif;
  letter-spacing: 0.02em;
}
html.lang-zh-Hant .invite h1, html.lang-zh-Hant .idx-name {
  font-family: 'Noto Serif TC', serif;
  letter-spacing: 0.02em;
}
html.lang-zh-Hans .brand-mark, html.lang-zh-Hant .brand-mark {
  font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
  font-style: normal;
  font-weight: 500;
  letter-spacing: 0.06em;
}
html.lang-zh-Hant .brand-mark {
  font-family: 'Noto Serif TC', serif;
}
html.lang-zh-Hans .city-name, html.lang-zh-Hant .city-name {
  letter-spacing: 0.02em;
}

/* ————— Stage ————— */
.stage {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1.35fr 1fr;
  align-items: center;
  gap: 40px;
  min-height: 0;
}

.globe-col {
  grid-column: 2;
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.globe-wrap {
  width: min(82vh, 720px);
  aspect-ratio: 1;
  position: relative;
}

/* ————— Left column: invitation text ————— */
.invite {
  grid-column: 1;
  max-width: 340px;
  align-self: center;
  padding-left: 10px;
}
.invite .eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 18px;
}
.invite h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 54px;
  line-height: 1.02;
  margin: 0 0 20px;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.invite h1 em {
  font-style: italic;
  color: var(--accent);
}
.invite p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin: 0 0 18px;
}
.invite .hint {
  margin-top: 28px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-soft);
  opacity: 0.7;
  display: flex;
  align-items: center;
  gap: 10px;
}
.invite .hint .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* ————— Right column: city index ————— */
.index {
  grid-column: 3;
  align-self: center;
  justify-self: end;
  max-width: 300px;
  width: 100%;
}
.index-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
}
.index-title em { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; letter-spacing: 0.02em; text-transform: none; color: var(--accent); }
.index-list { list-style: none; padding: 0; margin: 0; }
.index-list li {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  align-items: baseline;
  gap: 12px;
  padding: 11px 4px;
  border-bottom: 1px dashed var(--rule);
  cursor: pointer;
  transition: color .25s, padding-left .25s;
}
.index-list li:hover,
.index-list li.is-active {
  padding-left: 10px;
}
.index-list li:hover .idx-name,
.index-list li.is-active .idx-name {
  color: var(--accent);
}
.idx-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-soft);
  opacity: 0.6;
  letter-spacing: 0.1em;
}
.idx-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  color: var(--ink);
  transition: color .25s;
  letter-spacing: 0.01em;
}
.idx-country {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-soft);
  opacity: 0.7;
}

/* ————— Colophon ————— */
.colophon {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.colophon em {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  letter-spacing: 0.02em;
  text-transform: none;
  font-size: 13px;
  color: var(--ink);
}

/* ————— City Panel (slide-in from right) ————— */
.city-panel {
  position: fixed;
  top: 0;
  right: 0;
  height: 100vh;
  width: min(520px, 92vw);
  z-index: 30;
  box-shadow: -30px 0 80px rgba(40, 30, 15, 0.22), -2px 0 0 rgba(0,0,0,0.04);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 48px 44px 32px;
  transform: translateX(100%);
  opacity: 0;
  transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .5s ease;
  display: flex;
  flex-direction: column;
}
.city-panel.is-visible {
  transform: translateX(0);
  opacity: 1;
}
.city-panel::-webkit-scrollbar { width: 6px; }
.city-panel::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

.panel-close {
  position: absolute;
  top: 22px;
  right: 22px;
  width: 36px; height: 36px;
  background: transparent;
  border: 1px solid;
  border-radius: 50%;
  cursor: pointer;
  font-size: 13px;
  letter-spacing: 0.1em;
  opacity: 0.6;
  transition: opacity .25s, transform .25s;
}
.panel-close:hover { opacity: 1; transform: rotate(90deg); }

.panel-header { margin-bottom: 28px; }
.country-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.country-label .country-local {
  text-transform: none;
  letter-spacing: 0.05em;
  font-size: 13px;
  opacity: 0.75;
}
.city-name {
  font-size: 72px;
  line-height: 1;
  font-weight: 400;
  margin: 0;
  letter-spacing: -0.01em;
}
.city-local {
  font-size: 32px;
  margin-top: 4px;
  font-weight: 400;
  opacity: 0.9;
}
.city-tagline {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid;
  font-size: 17px;
  line-height: 1.5;
}
.coords {
  margin-top: 18px;
  font-size: 10px;
  letter-spacing: 0.2em;
  white-space: pre;
}

.panel-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid;
  margin-bottom: 24px;
}
.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 12px 4px;
  cursor: pointer;
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: color .2s, border-color .2s;
  margin-bottom: -1px;
}
.tab-btn .tab-glyph { font-size: 14px; }
.tab-btn.is-active { border-bottom-width: 2px; border-bottom-style: solid; }

.panel-body {
  flex: 1;
  animation: fadeSlide .5s ease;
}
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tab-list {
  display: flex;
  flex-direction: column;
}
.tab-item {
  display: grid;
  grid-template-columns: 1fr auto;
  padding: 18px 0;
  border-bottom: 1px solid;
  gap: 16px;
}
.tab-item:last-child { border-bottom: none; }
.item-main h3 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 500;
  line-height: 1.2;
}
.item-meta {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.item-main p {
  margin: 0;
  font-size: 15px;
  line-height: 1.55;
  opacity: 0.88;
}
.item-num {
  font-size: 10px;
  letter-spacing: 0.1em;
  padding-top: 4px;
}

.panel-footer {
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0.7;
}

/* ————— Tweaks panel ————— */
.tweaks {
  position: fixed;
  bottom: 18px;
  right: 18px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 14px 16px;
  z-index: 50;
  box-shadow: 0 10px 30px rgba(30,20,10,0.15);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: none;
  min-width: 220px;
}
.tweaks.is-on { display: block; }
.tweaks h4 {
  margin: 0 0 10px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--ink);
}
.tweak-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
.tweak-row label { opacity: 0.8; }
.tweak-row input[type=checkbox] { accent-color: var(--accent); }

/* Smaller screens */
@media (max-width: 1100px) {
  .stage { grid-template-columns: 1fr; }
  .invite, .index, .globe-col { grid-column: 1; justify-self: center; max-width: 560px; }
  .invite { text-align: center; }
  .invite .hint { justify-content: center; }
  .globe-wrap { width: min(70vw, 520px); }
}
</style>
</head>

  <script>
  // Load real coastline data from a CDN. Falls back silently to the simplified fallback.
  (function loadLand() {
    const urls = [
      'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json', // TopoJSON (tiny)
      'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_land.geojson'
    ];
    // Small TopoJSON decoder (just what we need for land-110m)
    function decodeTopo(topology) {
      const rings = [];
      const tf = topology.transform;
      const arcs = topology.arcs.map(arc => {
        let x = 0, y = 0;
        const out = [];
        for (const [dx, dy] of arc) {
          x += dx; y += dy;
          out.push([x * tf.scale[0] + tf.translate[0], y * tf.scale[1] + tf.translate[1]]);
        }
        return out;
      });
      const walkArcs = (arcIds) => {
        const ring = [];
        for (const id of arcIds) {
          const reverse = id < 0;
          const arc = arcs[reverse ? ~id : id];
          const seg = reverse ? arc.slice().reverse() : arc;
          if (ring.length) ring.pop();
          for (const p of seg) ring.push(p);
        }
        return ring;
      };
      const geom = topology.objects.land;
      const handleGeom = (g) => {
        if (g.type === 'Polygon') g.arcs.forEach(r => rings.push(walkArcs(r)));
        else if (g.type === 'MultiPolygon') g.arcs.forEach(poly => poly.forEach(r => rings.push(walkArcs(r))));
        else if (g.type === 'GeometryCollection') g.geometries.forEach(handleGeom);
      };
      handleGeom(geom);
      return rings;
    }
    function ingestGeoJSON(gj) {
      const rings = [];
      const addRing = (ring) => rings.push(ring);
      const handleGeom = (g) => {
        if (!g) return;
        if (g.type === 'Polygon') g.coordinates.forEach(addRing);
        else if (g.type === 'MultiPolygon') g.coordinates.forEach(poly => poly.forEach(addRing));
      };
      if (gj.type === 'FeatureCollection') gj.features.forEach(f => handleGeom(f.geometry));
      else if (gj.type === 'Feature') handleGeom(gj.geometry);
      else handleGeom(gj);
      return rings;
    }
    async function tryLoad() {
      for (const url of urls) {
        try {
          const res = await fetch(url, { mode: 'cors' });
          if (!res.ok) continue;
          const data = await res.json();
          let feature = null;
          if (data && data.type === 'Topology' && data.objects && data.objects.land && window.topojson) {
            feature = window.topojson.feature(data, data.objects.land);
          } else if (data && data.type === 'FeatureCollection') {
            feature = data;
          } else if (data && data.type === 'Feature') {
            feature = data;
          }
          if (feature) {
            window.LAND_GEOJSON = feature;
            window.dispatchEvent(new Event('land-data-loaded'));
            return;
          }
        } catch (e) { /* try next */ }
      }
    }
    tryLoad();
  })();
  </script>

  <script type="text/babel">
  const { useState, useEffect } = React;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "paperTone": "cool",
    "globeTheme": "atlas",
    "showGraticule": true,
    "autoRotate": true
  }/*EDITMODE-END*/;

  function App() {
    const [activeId, setActiveId] = useState(null);
    const [target, setTarget] = useState({ lon: null, lat: null });
    const [tweaksOn, setTweaksOn] = useState(false);
    const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
    const [lang, setLang] = useState(() => {
      try { return localStorage.getItem('atlas_lang') || 'en'; } catch (e) { return 'en'; }
    });
    const t = (window.I18N_UI && window.I18N_UI[lang]) || window.I18N_UI.en;

    useEffect(() => {
      try { localStorage.setItem('atlas_lang', lang); } catch (e) {}
      const root = document.documentElement;
      root.classList.remove('lang-en', 'lang-zh-Hans', 'lang-zh-Hant');
      root.classList.add('lang-' + lang);
      root.lang = lang === 'en' ? 'en' : (lang === 'zh-Hant' ? 'zh-Hant' : 'zh-Hans');
    }, [lang]);

    // Edit mode protocol
    useEffect(() => {
      const onMsg = (e) => {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === '__activate_edit_mode') setTweaksOn(true);
        if (e.data.type === '__deactivate_edit_mode') setTweaksOn(false);
      };
      window.addEventListener('message', onMsg);
      window.parent.postMessage({type: '__edit_mode_available'}, '*');
      return () => window.removeEventListener('message', onMsg);
    }, []);

    const setTweak = (k, v) => {
      setTweaks(t => {
        const next = {...t, [k]: v};
        window.parent.postMessage({type: '__edit_mode_set_keys', edits: {[k]: v}}, '*');
        return next;
      });
    };

    // Apply paper tone via CSS var
    useEffect(() => {
      const root = document.documentElement;
      if (tweaks.paperTone === 'cool') {
        root.style.setProperty('--bg',    '#e4e7ea');
        root.style.setProperty('--bg-2',  '#d6dbe0');
        root.style.setProperty('--paper', '#eef1f4');
        root.style.setProperty('--ink',   '#151a21');
        root.style.setProperty('--accent','#466b7a');
        root.style.setProperty('--rule',  '#c3cad2');
      } else if (tweaks.paperTone === 'dusk') {
        root.style.setProperty('--bg',    '#1b1a22');
        root.style.setProperty('--bg-2',  '#12121a');
        root.style.setProperty('--paper', '#22222c');
        root.style.setProperty('--ink',   '#f0ead8');
        root.style.setProperty('--ink-soft', '#b0a68b');
        root.style.setProperty('--accent','#e0a96d');
        root.style.setProperty('--rule',  '#3a3644');
      } else {
        root.style.setProperty('--bg',    '#efe8da');
        root.style.setProperty('--bg-2',  '#e7dfcd');
        root.style.setProperty('--paper', '#f7f1e3');
        root.style.setProperty('--ink',   '#1f1a12');
        root.style.setProperty('--ink-soft','#4a4134');
        root.style.setProperty('--accent','#a87247');
        root.style.setProperty('--rule',  '#d4c6a9');
      }
    }, [tweaks.paperTone]);

    const activeCity = window.CITIES.find(c => c.id === activeId) || null;

    const selectCity = (id) => {
      const c = window.CITIES.find(x => x.id === id);
      if (!c) return;
      setActiveId(id);
      setTarget({ lon: c.lon, lat: c.lat, _t: Date.now() });
    };

    return (
      <div className="app" data-screen-label="Atlas">
        <header className="masthead">
          <div className="brand">
            <span className="brand-mark">
              {lang === 'en'
                ? <>Atlas <span className="amp">&</span> Anticipation</>
                : <>{t.brand}</>}
            </span>
            <span className="brand-sub">{t.brandSub}</span>
          </div>
          <div className="lang-switch" role="tablist" aria-label="Language">
            <button
              className={'lang-btn' + (lang === 'en' ? ' is-active' : '')}
              onClick={() => setLang('en')}>EN</button>
            <button
              className={'lang-btn cjk' + (lang === 'zh-Hans' ? ' is-active' : '')}
              onClick={() => setLang('zh-Hans')}>简</button>
            <button
              className={'lang-btn cjk' + (lang === 'zh-Hant' ? ' is-active' : '')}
              onClick={() => setLang('zh-Hant')}>繁</button>
          </div>
        </header>

        <main className="stage">
          <section className="invite">
            <div className="eyebrow">{t.eyebrow}</div>
            <h1>{t.heroTitle[0]}<em>{t.heroTitle[1]}</em>{t.heroTitle[2]}</h1>
            <p>{t.heroP1}</p>
            <p style={{fontSize: 15, opacity: 0.85}}>{t.heroP2}</p>
            <div className="hint">
              <span className="dot"></span>
              <span>{t.hint}</span>
            </div>
          </section>

          <section className="globe-col">
            <Globe
              cities={window.CITIES}
              activeCity={activeId}
              onSelect={selectCity}
              targetLon={target.lon}
              targetLat={target.lat}
              autoRotate={tweaks.autoRotate}
              globeTheme={tweaks.globeTheme}
            />
          </section>

          <aside className="index">
            <div className="index-title">
              <span>{t.indexTitle}</span>
            </div>
            <ul className="index-list">
              {window.CITIES.map((c, i) => (
                <li key={c.id}
                  className={activeId === c.id ? 'is-active' : ''}
                  onClick={() => selectCity(c.id)}>
                  <span className="idx-num">{String(i+1).padStart(2,'0')}</span>
                  <span className="idx-name">{window.cityField(c, 'name', lang)}</span>
                  <span className="idx-country">{window.cityField(c, 'country', lang)}</span>
                </li>
              ))}
            </ul>
          </aside>
        </main>

        <footer className="colophon">
          <span>{t.colophonLeft}</span>
          <em>{t.colophonMid}</em>
          <span>{t.colophonRight}</span>
        </footer>

        <CityPanel city={activeCity} lang={lang} onClose={() => setActiveId(null)} />

        <div className={'tweaks' + (tweaksOn ? ' is-on' : '')}>
          <h4>{t.tweaks}</h4>
          <div className="tweak-row">
            <label>{t.tweakPaperTone}</label>
            <select
              value={tweaks.paperTone}
              onChange={e => setTweak('paperTone', e.target.value)}
              style={{fontFamily:'inherit', fontSize:10, textTransform:'uppercase', letterSpacing:'0.15em', background:'transparent', border:'1px solid var(--rule)', color:'var(--ink)', padding:'3px 6px'}}>
              <option value="warm">{t.paperWarm}</option>
              <option value="cool">{t.paperCool}</option>
              <option value="dusk">{t.paperDusk}</option>
            </select>
          </div>
          <div className="tweak-row">
            <label>Globe</label>
            <select
              value={tweaks.globeTheme}
              onChange={e => setTweak('globeTheme', e.target.value)}
              style={{fontFamily:'inherit', fontSize:10, textTransform:'uppercase', letterSpacing:'0.15em', background:'transparent', border:'1px solid var(--rule)', color:'var(--ink)', padding:'3px 6px'}}>
              <option value="topo">Topographic</option>
              <option value="atlas">Atlas Blue</option>
              <option value="verdant">Verdant</option>
              <option value="mono">Mono Ink</option>
              <option value="linen">Linen</option>
              <option value="dusk">Dusk</option>
            </select>
          </div>
          <div className="tweak-row">
            <label>{t.tweakAutoRotate}</label>
            <input type="checkbox" checked={tweaks.autoRotate}
              onChange={e => setTweak('autoRotate', e.target.checked)} />
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
